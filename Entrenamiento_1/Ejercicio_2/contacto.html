<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos/estilos.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">HOME</a>
        <a href="contacto.html">CONTACTO</a>
      </nav>
    </header>

    <main>
      <section class="fommulario">
        <form action="" method="post">
          <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombre" required />
          </div>
          <div class="campo">
            <label for="email">E-mail:</label>
            <input type=" email" name="email" id="email" placeholder="tu@mail.com" required />
          </div>
          <div class="campo">
            <label for="telefono">Telefono:</label>
            <input type="text" name="telefono" id="telefono" placeholder="11-xxxxxxx" required />
          </div>
          <div class="campo">
            <label for="mensaje">Mensaje:</label>
            <textarea name="mensaje" id="mensaje" placeholder="Dejanos tu comentario"></textarea>
          </div>
          <div class="botones">
            <input type="submit" value="Enviar" />
            <button type="reset">Cancelar</button>
          </div>
        </form>
      </section>
    </main>
    <footer>
      <p>Todos los derechos reservados</p>
    </footer>
  </body>
</html>
